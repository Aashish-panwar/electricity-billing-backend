version: '3.8'

services:

  mysql:
    image: mysql:8.4
    container_name: electricity_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: electricity_billing_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  backend:

    build: .

    container_name: electricity_backend

    restart: always

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/electricity_billing_db

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: root

volumes:

  mysql-data: